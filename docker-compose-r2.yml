services:
  wordpress:
    build: .
    restart: always
    ports:
      - "8100:80"
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}
      WORDPRESS_DB_HOST: ${DB_HOST:-db}
      WORDPRESS_DB_USER: ${DB_USER:-frankenwp_user}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-frankenwp_password}
      WORDPRESS_DB_NAME: ${DB_NAME:-frankenwp_db}
      WORDPRESS_DEBUG: ${WP_DEBUG:-true}
      WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
      
      # FrankenWP Cache Settings
      CACHE_LOC: ${CACHE_LOC:-/var/www/html/wp-content/cache}
      TTL: ${TTL:-80000}
      PURGE_PATH: ${PURGE_PATH:-/__cache/purge}
      PURGE_KEY: ${PURGE_KEY:-}
      BYPASS_HOME: ${BYPASS_HOME:-false}
      BYPASS_PATH_PREFIXES: ${BYPASS_PATH_PREFIXES:-/wp-admin,/wp-content,/wp-includes,/wp-json,/feed}
      CACHE_RESPONSE_CODES: ${CACHE_RESPONSE_CODES:-200,404,405}
      
      # Cloudflare R2 Settings (optional - can be set in wp-config.php instead)
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
      CLOUDFLARE_R2_BUCKET_URL: ${CLOUDFLARE_R2_BUCKET_URL:-}
      CLOUDFLARE_R2_ACCESS_KEY: ${CLOUDFLARE_R2_ACCESS_KEY:-}
      CLOUDFLARE_R2_SECRET_KEY: ${CLOUDFLARE_R2_SECRET_KEY:-}
      
      CADDY_GLOBAL_OPTIONS: |
        email myemail@sample.com
        auto_https disable_redirects
        debug
      WORDPRESS_CONFIG_EXTRA: |
          define('WP_SITEURL', 'http://localhost:8100');
          define('WP_HOME', 'http://localhost:8100');
          
          // Cloudflare R2 Configuration (if using env vars)
          if (!empty($_ENV['CLOUDFLARE_R2_ENDPOINT'])) {
              define('S3_UPLOADS_ENDPOINT', $_ENV['CLOUDFLARE_R2_ENDPOINT']);
              define('S3_UPLOADS_BUCKET', $_ENV['CLOUDFLARE_R2_BUCKET']);
              define('S3_UPLOADS_BUCKET_URL', $_ENV['CLOUDFLARE_R2_BUCKET_URL']);
              define('S3_UPLOADS_REGION', 'auto');
              define('S3_UPLOADS_KEY', $_ENV['CLOUDFLARE_R2_ACCESS_KEY']);
              define('S3_UPLOADS_SECRET', $_ENV['CLOUDFLARE_R2_SECRET_KEY']);
          }
          
    volumes:
      # Mount uploads for persistence (R2 will handle the actual storage)
      - wp_uploads:/var/www/html/wp-content/uploads
    depends_on:
      - db
    tty: true

  db:
    image: mariadb:latest
    restart: always
    ports:
      - ${LOCAL_DB_PORT:-3311}:3306
    environment:
      MYSQL_DATABASE: ${DB_NAME:-frankenwp_db}
      MYSQL_USER: ${DB_USER:-frankenwp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-frankenwp_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - dbwp:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - ${LOCAL_PHPMYADMIN_PORT:-8086}:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    depends_on:
      - db

volumes:
  dbwp:
  wp_uploads: 